name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci-pipeline:
    name: Run CI Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: 3. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 4. Cache Python and Node dependencies
        run: echo "Dependencies are cached dynamically via setup-python and setup-node actions."

      - name: 5. Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: 6. Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 7. Run backend tests with pytest
        working-directory: ./backend
        env:
          PYTHONPATH: .
        run: pytest

      - name: 8. Run frontend lint
        working-directory: ./frontend
        run: npm run lint

      - name: 9. Run TypeScript type checking
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: 10. Build the Next.js frontend
        working-directory: ./frontend
        run: npm run build

      - name: 11. Build backend Docker image
        run: docker build -t procureai-backend:ci backend/

      - name: 12. Build frontend Docker image
        run: docker build -t procureai-frontend:ci frontend/
